# SciDraft theme defaults.
# Hugo merges this with the site's config; any setting in the site's
# hugo.toml overrides the same key here. A fresh SciDraft site gets all
# of these out of the box.

[pagination]
  pagerSize = 6

[params]
  # Scientific content: enable math rendering by default
  math = true
  ShowShareButtons = true
  ShowReadingTime = true
  ShowToc = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowRelatedPosts = true
  # Identity defaults; each note's front matter can override with its
  # own institute / author
  institute = "DyCoAI.com"
  author = "mengyaozhu"

  # Fallback link for {{< promotion-visual >}} images (empty by default)
  # promotionLink = ""

  # Entry index sets: one block per series of notes, naming the front-matter
  # fields the entry-a-to-z / entry-categories shortcodes read, the optional
  # membership tag, and the count label. Falls back to entryTitle /
  # entryCategory / entryAliases / entrySummary when a set is absent.
  # [params.entrySets.example]
  #   titleField    = "entryTitle"
  #   categoryField = "entryCategory"
  #   aliasesField  = "entryAliases"
  #   summaryField  = "entrySummary"
  #   tag           = ""
  #   countLabel    = "Entries"

# NOTE: [outputs] home = ["HTML", "RSS", "JSON"] cannot be inherited from
# theme config (Hugo root key) — a site must set it itself for search to
# work. Documented in README.

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    # NOTE: math delimiter preservation (goldmark passthrough) cannot be
    # set from theme config — Hugo does not merge [markup] from themes.
    # Sites must add the passthrough block themselves (see README).
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    noClasses = false
