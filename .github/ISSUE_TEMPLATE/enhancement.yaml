name: Enhancement 🚀
description: Propose a new feature or change for SciDraft
title: "[Enhancement]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to propose an enhancement to SciDraft :)
        - Search previous [Issues](https://github.com/mengyaozhu/scidraft/issues) in case this was already proposed.
        - If it is a question rather than a proposal, consider opening a regular issue instead.
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to propose?
      description: Describe the feature or change, and the problem it solves for scientific writing/notes.
      placeholder: A clear description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Any existing workaround, theme option, or shortcode you already tried.
      placeholder: Optional.
    validations:
      required: false
