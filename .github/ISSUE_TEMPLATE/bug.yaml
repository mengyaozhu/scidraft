name: Bug Report 🐞
description: Report a problem with the SciDraft theme
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in SciDraft :)
        - Please describe the problem in as much detail as you can.
        - Check the theme's [README](https://github.com/mengyaozhu/scidraft#readme) first — install steps and required site config are documented there.
        - Search previous [Issues](https://github.com/mengyaozhu/scidraft/issues) in case this is already reported.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: A bug happened! Here are the screenshots.. Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to reproduce
      description: How can we recreate the problem?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: hugo_version
    attributes:
      label: Hugo Version
      description: What version of Hugo are you running? (Run `hugo version`)
      options:
        - "Hugo >= 0.158.0 (supported — minimum version for SciDraft)"
        - "Hugo < 0.158.0 (unsupported — please upgrade)"
    validations:
      required: true
  - type: input
    id: scidraft_version
    attributes:
      label: SciDraft Version
      description: Which version of the theme are you running?
      placeholder: |
        Branch main, or
        Commit-id (see `git log -1` inside themes/SciDraft)
    validations:
      required: true
  - type: dropdown
    id: device_type
    attributes:
      label: What kind of device shows the problem?
      multiple: true
      options:
        - Mobile
        - Desktop
    validations:
      required: false
  - type: dropdown
    id: browsers
    attributes:
      label: What browsers show the problem?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Microsoft Edge
    validations:
      required: false
  - type: input
    id: browser_version
    attributes:
      label: Browser Version
      description: Please add the browser version or your user agent string (navigator.userAgent)
      placeholder: ex. Google Chrome 130.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant console or `hugo server` output. It is auto-formatted, no backticks needed.
      render: shell
    validations:
      required: false
  - type: input
    id: repo_url
    attributes:
      label: Link to a site or repository where the issue appears
      description: Optional — a public URL or repo helps a lot.
      placeholder: https://github.com/<username>/<repo name>
    validations:
      required: false
