name: Build Check

# Verifies that the theme builds on the MINIMUM supported Hugo version
# (min_version in theme.toml) whenever the theme changes. The deploy
# workflow (gh-pages.yml) builds the demo on the pinned current Hugo.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hugoVersion:
        description: "Hugo Version"
        required: false
        default: "0.158.0"

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    env:
      # keep in sync with min_version in theme.toml
      HUGO_VERSION: ${{ github.event.inputs.hugoVersion || '0.158.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Expose the repo as the theme Hugo expects
        run: |
          mkdir -p "$RUNNER_TEMP/hugo-themes"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/hugo-themes/SciDraft"

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Build exampleSite with Hugo
        run: hugo --source exampleSite --themesDir "$RUNNER_TEMP/hugo-themes" --gc --baseURL "https://example.org/"
