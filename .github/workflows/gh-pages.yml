name: Deploy SciDraft demo to GitHub Pages

# Builds the exampleSite/ demo on every push to main and publishes it to
# GitHub Pages, so https://mengyaozhu.github.io/scidraft/ always shows the
# theme exactly as its users see it. One-time setup after the first push:
# repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# (the configure-pages step below enables this automatically when it can).

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      hugoVersion:
        description: "Hugo Version"
        required: false
        default: "0.147.0"

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: ${{ github.event.inputs.hugoVersion || '0.147.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Build exampleSite with Hugo
        run: |
          hugo \
            --source exampleSite \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: exampleSite/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
